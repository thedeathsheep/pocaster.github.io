name: Deploy portfolio to Tencent Cloud

on:
  push:
    branches: [redesign-frame-system]
  workflow_dispatch:

concurrency:
  group: portfolio-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: 139.155.139.62
      DEPLOY_USER: ubuntu
      DEPLOY_PATH: /var/www/portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build Jekyll site
        run: bundle exec jekyll build
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
      - name: Trust server and upload build
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete _site/ "$DEPLOY_USER@$DEPLOY_HOST:/tmp/portfolio-release/"
      - name: Activate release
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" <<'REMOTE'
          set -e
          timestamp=$(date +%Y%m%d-%H%M%S)
          sudo cp -a /var/www/portfolio "/var/www/portfolio-backup-$timestamp"
          sudo find /var/www/portfolio -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          sudo cp -a /tmp/portfolio-release/. /var/www/portfolio/
          sudo chown -R www-data:www-data /var/www/portfolio
          sudo find /var/www/portfolio -type d -exec chmod 755 {} \;
          sudo find /var/www/portfolio -type f -exec chmod 644 {} \;
          sudo nginx -t
          sudo systemctl reload nginx
          REMOTE
